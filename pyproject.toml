[project]
name = "dothub"
version = "0.5.22"
description = "FunPay bot."
requires-python = ">=3.15.2"

dependencies = [
    "aiosqlite~=0.22.1",
    "eventry~=0.7.2",
    "funpaybotengine==0.10.0rc5",
    "hubplatform",
    "packaging~=25.0",
]

authors = [
    {name = "Qvvonk", email="qvvonk@gmail.com"}
]

maintainers = [
    {name = "Qvvonk", email="qvvonk@gmail.com"}
]


[project.urls]
"Telegram Channel" = "https://t.me/funpay_hub"
Repository = "https://github.com/funpayhub/funpayhub"
Issues = "https://github.com/funpyahub/funpayhub/issues"


[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-asyncio>=1.1.0",
]
dev = [
    "mypy>=1.17.0",
    "ruff~=0.17",
]
docs = [
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.1.3",
    "sphinx-design>=0.6.1",
]


[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"


[tool.mypy]
plugins = "pydantic.mypy"
python_version = '3.15'
warn_redundant_casts = true
warn_unused_ignores = true
strict = true
pretty = true
exclude = [
    "docs",
    ".venv",
]


[pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = true


[tool.ruff]
line-length = 99
exclude = [
    ".git",
    "build",
    "dist",
    "venv",
    ".venv",
    "docs",
    "*.egg-info"
]


[tool.ruff.format]
quote-style = "single"
line-ending = "lf"
indent-style = "space"


[tool.ruff.lint]
select = [
    "I",
    "N",
    "C4",
    "E",
    "F",
    "T20",
    "RET",
    "COM"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]
"app.py" = ["E402"]
"launcher.py" = ["E402"]


[tool.ruff.lint.isort.sections]
fphlib = ["funpayhub.lib.*"]
fphapp = ["funpayhub.app.*"]

[tool.uv.sources.hubplatform]
git = "https://github.com/funpayhub/platform"
rev = "efcc8eed0621cae415d74b78ce8ed5cd943c6346"
subdirectory = "packages/hubplatform"


[tool.uv]
package = false


[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "fphlib", "fphapp", "local-folder"]
required-imports = ["from __future__ import annotations"]
force-to-top = ["typing", "dataclasses"]
length-sort = true
lines-between-types = 0
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true
force-wrap-aliases = true
