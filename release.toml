# Release build config, read by tools/build_release.py.
#
# A release consists of two parts:
#   * runtime: Python (python-build-standalone) + third-party packages, one archive per platform.
#     Its id is a hash of everything below + the locked third-party packages, so releases that
#     do not change them reuse the same runtime and users do not download it again.
#   * app: our code + first-party packages, one zip for all platforms.

[runtime]
python = "3.15.2"
pbs-release = "20261026"  # https://github.com/astral-sh/python-build-standalone/releases
manylinux = "2_28"        # oldest glibc supported on Linux
platforms = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]


[app]
name = "funpayhub"
entrypoint = "app.py"
launcher-protocol = 1
include = ["app.py", "dothub", "pyproject.toml", "launcher.py"]
first-party = ["hubplatform"]  # installed into the app (lib/), not into the runtime
